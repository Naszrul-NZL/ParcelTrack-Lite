<text x="720" y="355" class="hint">Inherited attributes come from USER.</text>
<text x="720" y="388" class="hint">Each USER is exactly one subclass.</text>
<text x="90" y="1570" class="note">PK = primary key    FK = foreign key    UK = unique key    ? = nullable. Each subclass user_id is its PK and a FK to USER.id.</text>
<text x="90" y="1605" class="note">USER history and audit associations apply to all three subclasses. ADMIN assignment is logged in AUDIT_EVENT; PARCEL has no admin_id.</text>
<text x="90" y="1640" class="note">PARCEL unique pair: (seller_id, client_request_id). Recipient fields and fingerprint may be cleared after anonymization.</text>
<text x="90" y="1675" class="note">Implemented in 0004_integrated_erd: subclasses, proof schema and initial history. Upload and finalization endpoints remain planned.</text></svg>
