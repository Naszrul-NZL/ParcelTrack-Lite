<path d="M490 860 L520 842 V878 Z" fill="white" stroke="#555" stroke-width="2.3"/>
<text x="573" y="1000" class="hint" transform="rotate(-90 573 1000)">inherits USER</text>
<text x="535" y="1115" class="hint" transform="rotate(-90 535 1115)">{complete, disjoint}</text>
</g>
