<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1710" viewBox="0 0 2600 1710" role="img" aria-labelledby="title desc"><title id="title">Integrated ParcelTrack Lite ERD with USER superclass and SELLER, RIDER and ADMIN subclasses</title><desc id="desc">Eight unique entity boxes form a single connected diagram. A hollow generalization triangle points from the three subclasses to USER. SELLER creates PARCEL, RIDER is assigned PARCEL and uploads DELIVERY_PROOF, and ADMIN assigns PARCEL via a dashed operation link. Nine stored associations have numeric cardinalities. All entity fields are shown.</desc><style>text{font-family:Arial,sans-serif;fill:#222}.title{font-size:34px;font-weight:bold}.note{font-size:21px}.table-title{font-size:23px;font-weight:bold}.field{font-size:20px}.key{font-size:16px;fill:#444}.line,.inherit{fill:none;stroke:#555;stroke-width:2.3}.operation{fill:none;stroke:#555;stroke-width:2.3;stroke-dasharray:10 7}.count{font-size:20px;font-weight:bold;paint-order:stroke;stroke:white;stroke-width:8px;stroke-linejoin:round}.label{font-size:20px;text-anchor:middle;paint-order:stroke;stroke:white;stroke-width:9px;stroke-linejoin:round}.hint{font-size:19px;fill:#444}</style><rect width="2600" height="1710" fill="white"/><text x="90" y="55" class="title">ParcelTrack Lite · Integrated superclass and subclass ERD</text>
<text x="90" y="96" class="note">1..1 = exactly one    0..1 = optional one    0..* = zero or many    1..* = one or many</text>
<text x="90" y="132" class="note">Solid lines: stored associations    Hollow triangle: inherits from USER    Dashed line: administrative operation</text>
<g data-kind="generalization" data-parent="USER" data-children="SELLER RIDER ADMIN">
